services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: smart-coldchain-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: development
      - key: LOG_LEVEL
        value: INFO
      - key: SENSOR_GAP_MINUTES
        value: "5"
      - key: INTEGRITY_BATCH_MAX_RECORDS
        value: "100"
      - key: INTEGRITY_BATCH_MAX_AGE_MINUTES
        value: "5"
      - key: MAX_SAMPLE_GAP_SECONDS
        value: "300"
      - key: PAYOUT_REQUIRES_ANCHORED_EVIDENCE
        value: "true"
      - key: BLOCKCHAIN_ENABLED
        value: "false"
      - key: BLOCKCHAIN_CONFIRMATIONS
        value: "1"
      - key: BLOCKCHAIN_NETWORK
        sync: false
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BLOCKCHAIN_CHAIN_ID
        sync: false
      - key: DATA_INTEGRITY_CONTRACT_ADDRESS
        sync: false
      - key: BACKEND_ANCHORER_PRIVATE_KEY
        sync: false
      - key: DATA_INTEGRITY_ABI_PATH
        value: backend/app/integrations/abi/ColdChainDataIntegrity.json
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # 2. Frontend Static Site (React + Vite SPA)
  - type: web
    name: smart-coldchain-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_ENABLE_DEMO
        value: "true"

